# Integração contínua do MorphoBr (ver #143).
#
# - check: os dicionários e as listas de lemas estão na ordem canônica.
# - build: compila o léxico completo (morphobr.bin) com compile.sh, confere
#   algumas análises e publica o transdutor como artefato do run. Em pull
#   requests, compara a lista full-form completa (tools/expand.sh) com a da
#   base e escreve no resumo do run quantos pares saíram e entraram.
#
# O foma é compilado do fork com pilha dinâmica (mhulden/foma#176): o foma
# 0.10.0 aborta com "Stack full!" ao ler o léxico. Quando o PR for aceito e
# houver uma versão nova, basta trocar FOMA_REPO/FOMA_REF.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOMA_REPO: https://github.com/arademaker/foma
  FOMA_REF: cc6da1fed97f245b2dc6d24105c81154a3627e37
  FOMA: ${{ github.workspace }}/../foma-src/foma/build/foma
  FLOOKUP: ${{ github.workspace }}/../foma-src/foma/build/flookup

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ordem canônica dos dicionários e das listas de lemas
        run: tools/canonicalize.sh --check

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y bison flex libreadline-dev zlib1g-dev

      - name: Cache do foma
        id: foma-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../foma-src
          key: foma-${{ runner.os }}-${{ env.FOMA_REF }}

      - name: Compila o foma (pilha dinâmica)
        if: steps.foma-cache.outputs.cache-hit != 'true'
        run: |
          git clone "$FOMA_REPO" ../foma-src
          cd ../foma-src
          git checkout "$FOMA_REF"
          cmake -S foma -B foma/build -DCMAKE_BUILD_TYPE=Release
          cmake --build foma/build -j "$(nproc)"

      - name: Stack (Haskell)
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - name: Cache do stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            code/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('code/stack.yaml', 'code/stack.yaml.lock', 'code/package.yaml', 'code/src/**', 'code/app/**') }}
          restore-keys: stack-${{ runner.os }}-

      - name: Compila o léxico (compile.sh)
        run: ./compile.sh

      - name: Confere algumas análises
        run: |
          check() {
            if ! echo "$1" | "$FLOOKUP" -i -a morphobr.bin | grep -qxF "$(printf '%s\t%s' "$1" "$2")"; then
              echo "::error::análise ausente: $1 -> $2"
              exit 1
            fi
          }
          check casa      casa+N+F+SG                      # full-form
          check casinha   casa+N+DIM+F+SG                  # diminutivo (regras)
          check pãezinhos pão+N+DIM+M+PL                   # diminutivo do plural
          check fique     ficar+V+SBJR+1+SG                # verbo em -ar (regras)
          check conheço   conhecer+V+PRS+1+SG              # verbo em -er (regras)
          check atribui   atribuir+V+PRS+3+SG              # classe -uir (regras)
          check quis      querer+V+PRF+1+SG                # irregular (full-form)
          check comprei-o comprar+V.ele.ACC.3.M.SG+PRF+1+SG  # clítico

      - name: Publica o transdutor
        uses: actions/upload-artifact@v4
        with:
          name: morphobr.bin
          path: morphobr.bin
          retention-days: 30

      - name: Diferença no léxico em relação à base
        if: github.event_name == 'pull_request'
        run: |
          tools/expand.sh > ../after.txt
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          if [ -x ../base/tools/expand.sh ]; then
            (cd ../base && tools/expand.sh > ../before.txt)
          else
            cat ../base/{nouns,verbs,clitics,adjectives,adverbs}/*.dict | LC_ALL=C sort -u > ../before.txt
          fi
          LC_ALL=C sort -u ../before.txt > ../before.s
          LC_ALL=C sort -u ../after.txt > ../after.s
          LC_ALL=C comm -23 ../before.s ../after.s > ../removidos.txt
          LC_ALL=C comm -13 ../before.s ../after.s > ../acrescentados.txt
          {
            echo "## Diferença no léxico (tools/expand.sh): base × PR"
            echo
            echo "| | pares |"
            echo "|---|---|"
            echo "| base | $(wc -l < ../before.s) |"
            echo "| PR | $(wc -l < ../after.s) |"
            echo "| removidos | $(wc -l < ../removidos.txt) |"
            echo "| acrescentados | $(wc -l < ../acrescentados.txt) |"
            for f in removidos acrescentados; do
              if [ -s ../$f.txt ]; then
                echo
                echo "<details><summary>$f (primeiros 100)</summary>"
                echo
                echo '```'
                head -100 ../$f.txt
                echo '```'
                echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ../diff && cp ../removidos.txt ../acrescentados.txt ../diff/

      - name: Publica a diferença
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: diferenca-lexico
          path: ${{ github.workspace }}/../diff/
          retention-days: 30
